function card(d){const ott=d.ott.length?d.ott.map(o=>`<a href="${o.url}" target="_blank" rel="noopener" style="background:${C[o.service]||'#2c3446'}">${o.service} · ${o.type}</a>`).join(''):`<span class="none">${d.st.includes('미제공')?'국내 미제공':'국내 OTT 확인 불가'}</span>`;
const bd=d.src.map(s=>`<span class="badge b-${s}">${s=='NYT'?'NYT '+d.rank+'위':SN[s]}</span>`).join('')+(d.src.length>1?'<span class="badge b-both">겹침</span>':'');
return `<div class="card" onclick="if(!event.target.closest('a'))show('${d.k.replace(/'/g,'')}')"><div>${bd}</div><div class="t">${d.ko||d.title}</div><div class="e">${d.title} · ${d.year} · ${d.kind}</div><div class="meta">${d.genre} ${d.m?'· 추천 '+d.m+'회 ':''}· ${d.imdb?`<a href="${d.imdb}" target="_blank">IMDb</a>`:'IMDb 확인 필요'}${d.jw?` · <a href="${d.jw}" target="_blank">JustWatch</a>`:''}</div><div class="ott">${ott}</div></div>`}
function render(){const s=q.value.toLowerCase();const sf=srcf.value;let L=D.filter(d=>(!sf||(sf=='BOTH'?d.src.length>1:d.src.includes(sf)))&&(!kind.value||d.kind==kind.value)&&(!G||mg(d.genre)==G)&&(!svc.value||d.ott.some(o=>o.service==svc.value))&&(!s||(d.title+(d.ko||'')).toLowerCase().includes(s)));
L.sort(sort.value=='r'?(a,b)=>(a.rank||999)-(b.rank||999):sort.value=='m'?(a,b)=>b.m-a.m:sort.value=='y'?(a,b)=>b.year-a.year:(a,b)=>(a.ko||a.title).localeCompare(b.ko||b.title,'ko'));count.textContent=L.length+'편';
const grp={};L.forEach(d=>(grp[mg(d.genre)]=grp[mg(d.genre)]||[]).push(d));list.innerHTML=Object.keys(grp).sort().map(g=>`<h2>${g} (${grp[g].length})</h2><div class="grid">${grp[g].map(card).join('')}</div>`).join('')}
[q,srcf,kind,svc,sort].forEach(e=>e.oninput=render);render();
const KM={};D.forEach(d=>KM[d.k.replace(/'/g,'')]=d);
function show(k){const d=KM[k],x=DET[d.k]||{};mdc.innerHTML=`<h2 style="margin-top:0">${d.ko||d.title}</h2><div class="sub">${d.title} · ${d.year} · ${d.kind} · ${d.genre}</div><dl>
<dt>${d.kind=='TV'?'크리에이터/쇼러너/감독':'감독'}</dt><dd>${x.director||'확인 필요'}</dd><dt>주요 출연</dt><dd>${x.cast||'확인 필요'}</dd><dt>주요 수상</dt><dd>${x.awards||'확인 필요'}</dd>
<dt>제작국가 / ${d.kind=='TV'?'편수':'러닝타임'}</dt><dd>${x.country||'확인 필요'} / ${x.length||'확인 필요'}</dd>
<dt>해설 (요약) — 영화적 미학</dt><dd>${x.commentary||'확인 필요'}${x.commentary_src?` <a href="${x.commentary_src}" target="_blank">[위키백과]</a>`:''}</dd>
<dt>핵심 포인트</dt><dd><ul style="margin:4px 0;padding-left:18px">${(x.points||[]).map(p=>`<li>${p}</li>`).join('')}</ul></dd></dl>
<div class="sub">사실 정보 출처: ${x.wikidata?`<a href="${x.wikidata}" target="_blank">Wikidata</a>`:'—'} · 해설은 위키백과 도입부 발췌 요약 · 출연진은 Wikidata 등록 순(대표성 확인 필요)</div><div class="ott">${d.ott.map(o=>`<a href="${o.url}" target="_blank" style="background:${C[o.service]||'#2c3446'}">${o.service} · ${o.type}</a>`).join('')||'<span class="none">국내 OTT 없음/확인 불가</span>'}</div><p><button onclick="md.style.display='none'">닫기</button></p>`;md.style.display='flex'}
</script></body></html>
